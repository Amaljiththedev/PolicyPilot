# Whole app:   docker compose up --build        -> API on http://localhost:8000/docs
# Tests:       docker compose exec api python -m pytest -q
# Evals:       docker compose exec api python -m evals.run --name docker_check
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: policypilot_db
    restart: always
    environment:
      POSTGRES_USER: policypilot
      POSTGRES_PASSWORD: policypilot
      POSTGRES_DB: policypilot
    ports:
      - "5432:5432"          # still reachable from your laptop for local dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policypilot -d policypilot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: policypilot_api
    restart: unless-stopped
    env_file: .env           # API keys + settings; never baked into the image
    environment:
      # inside Docker the database is the "db" service, not localhost
      DATABASE_URL: postgresql://policypilot:policypilot@db:5432/policypilot
      HF_HUB_OFFLINE: "1"    # models are already in the image
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./evals:/app/evals   # eval data in, result JSONs out, straight to your folder
      - ./corpus:/app/corpus:ro   # source documents, read-only
      - ./app:/app/app:ro         # dev: code changes apply on restart, no rebuild (remove for production)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets the container reach Ollama on your laptop

  # Optional workers. Start with:  docker compose --profile slack --profile drive up -d
  slack:
    build: .
    profiles: ["slack"]
    command: ["python", "scripts/slack_bot.py"]
    healthcheck:
      disable: true          # the image healthcheck probes the API port; workers have none
    env_file: .env
    environment:
      DATABASE_URL: postgresql://policypilot:policypilot@db:5432/policypilot
      HF_HUB_OFFLINE: "1"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  drive-sync:
    build: .
    profiles: ["drive"]
    command: ["python", "scripts/drive_sync.py", "--loop"]
    healthcheck:
      disable: true          # the image healthcheck probes the API port; workers have none
    env_file: .env
    environment:
      DATABASE_URL: postgresql://policypilot:policypilot@db:5432/policypilot
      HF_HUB_OFFLINE: "1"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
