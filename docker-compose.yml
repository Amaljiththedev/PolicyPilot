services:
  db:
    image: pgvector/pgvector:pg16
    container_name: policypilot_db
    restart: always
    environment:
      POSTGRES_USER: policypilot
      POSTGRES_PASSWORD: policypilot
      POSTGRES_DB: policypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
